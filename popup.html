<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Apex AutoFill</title>
    <style>
      body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 14px;
        margin: 0;
        color: #111827;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 12px;
        line-height: 1.4;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        background: #16a34a;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #15803d;
      }
      #status {
        font-size: 11px;
        margin-top: 8px;
        min-height: 14px;
      }
      #status.ok {
        color: #16a34a;
      }
      #status.err {
        color: #dc2626;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>🤖 Apex AutoFill</h1>
    <p>
      Paste your OpenRouter (free tier) API key below. It's stored only
      in your browser and used to ask an AI model (via OpenRouter) to read the jumbled PDF
      text.
    </p>
    <label for="apiKey">OpenRouter API key</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
    <button id="saveBtn">Save key</button>
    <div id="status"></div>
    <p style="margin-top:12px;">
      Don't have one? Get a free one at
      <a href="https://openrouter.ai/keys" target="_blank"
        >openrouter.ai/keys</a
      >. No credit card needed for free models.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
